alias: "System - Monitor & Alert"
description: "Surveillance dynamique des Add-ons (basée sur CPU) et de l'hôte."

trigger:
  # --------------------------------------------------------------------------
  # 1. ADD-ON CRASH SCANNER (Dynamique)
  # Déclenche si un Add-on (identifié par son CPU) a un statut OFF
  # --------------------------------------------------------------------------
  - platform: template
    id: "addon_crash"
    value_template: >
      {# On récupère tous les sensors CPU #}
      {% set cpu_sensors = states.sensor 
        | selectattr('entity_id', 'search', 'cpu_percent|pourcentage_du_processeur')
        | rejectattr('entity_id', 'search', 'node_|qemu_|pc_debian_')
        | list %}
      
      {% set ns = namespace(crashed=[]) %}
      {% for cpu in cpu_sensors %}
        {# On devine le nom de base #}
        {% set base = cpu.entity_id.replace('sensor.', '').replace('_cpu_percent', '').replace('_pourcentage_du_processeur', '') %}
        {# On cherche le binary_sensor associé (FR ou EN) #}
        {% set st_run = "binary_sensor." ~ base ~ "_running" %}
        {% set st_exec = "binary_sensor." ~ base ~ "_en_cours_d_execution" %}
        {% set status_ent = st_run if states(st_run) != 'unknown' else st_exec %}
        
        {# Si l'entité de statut existe ET est OFF, c'est un crash #}
        {% if states(status_ent) == 'off' %}
          {% set ns.crashed = ns.crashed + [1] %}
        {% endif %}
      {% endfor %}
      {{ ns.crashed | count > 0 }}
    for: "00:01:00"

  # --------------------------------------------------------------------------
  # 2. ADD-ON CPU HOG SCANNER (Dynamique)
  # Déclenche si n'importe quel sensor CPU dépasse 80%
  # --------------------------------------------------------------------------
  - platform: template
    id: "cpu_overload"
    value_template: >
      {{ states.sensor 
         | selectattr('entity_id', 'search', 'cpu_percent|pourcentage_du_processeur')
         | rejectattr('entity_id', 'search', 'node_|qemu_|pc_debian_')
         | map(attribute='state') 
         | map('float', 0) 
         | select('gt', 80) 
         | list | count > 0 }}
    for: "00:05:00"

  # --------------------------------------------------------------------------
  # 3. HOST HEALTH (Chips)
  # --------------------------------------------------------------------------
  - platform: numeric_state
    entity_id: sensor.system_monitor_temperature_du_processeur
    above: 75
    for: "00:02:00"
    id: "host_heat"

  - platform: numeric_state
    entity_id: sensor.glances_ha_utilisation_de_la_memoire
    above: 90
    for: "00:05:00"
    id: "host_ram"

  - platform: numeric_state
    entity_id: sensor.glances_ha_utilisation_disque_data
    above: 90
    for: "00:05:00"
    id: "host_disk"

  - platform: numeric_state
    entity_id: sensor.frigate_intel_vaapi_gpu_load
    above: 90
    for: "00:02:00"
    id: "host_gpu"

  # --------------------------------------------------------------------------
  # A. ENQUÊTE (Variables) : Qui appelle ?
  # --------------------------------------------------------------------------
action:
  - variables:
      infos_coupable: >
        {# On initialise l'enquête avec des valeurs par défaut #}
        {% set enquete = namespace(resultat={'nom': 'Système', 'identifiant_icone': 'homeassistant', 'cpu': 0, 'ram': 0, 'disk': 0, 'etat': 'Inconnu'}) %}
        
        {# 1. SCAN : On récupère tous les candidats via leur CPU #}
        {% set liste_capteurs_cpu = states.sensor 
           | selectattr('entity_id', 'search', 'cpu_percent|pourcentage_du_processeur')
           | rejectattr('entity_id', 'search', 'node_|qemu_|pc_debian_')
           | list %}

        {# 2. ANALYSE SELON LE TRIGGER #}
        {% if trigger.id == 'addon_crash' %}
          {# CAS CRASH : On cherche quel Add-on est éteint #}
          {% for capteur_cpu in liste_capteurs_cpu %}
            {# a. Nettoyage du nom pour trouver la racine #}
            {% set nom_simplifie = capteur_cpu.entity_id.replace('sensor.', '').replace('_cpu_percent', '').replace('_pourcentage_du_processeur', '') %}
            
            {# b. On construit les noms potentiels du binary_sensor #}
            {% set entite_running_anglais = "binary_sensor." ~ nom_simplifie ~ "_running" %}
            {% set entite_running_francais = "binary_sensor." ~ nom_simplifie ~ "_en_cours_d_execution" %}
            
            {# c. On garde celui qui existe vraiment #}
            {% set entite_statut_reelle = entite_running_anglais if states(entite_running_anglais) != 'unknown' else entite_running_francais %}
            
            {% if states(entite_statut_reelle) == 'off' %}
              {# C'est lui ! On clôture l'enquête #}
              {% set enquete.resultat = {
                'nom': state_attr(entite_statut_reelle, 'friendly_name') | default(nom_simplifie),
                'identifiant_icone': nom_simplifie,
                'cpu': states(capteur_cpu.entity_id),
                'ram': states(capteur_cpu.entity_id.replace('cpu', 'memory').replace('processeur', 'memoire')),
                'etat': 'OFF'
              } %}
            {% endif %}
          {% endfor %}

        {% elif trigger.id == 'cpu_overload' %}
           {# CAS SURCHARGE : On cherche le plus gros consommateur #}
           {% set gros_consommateur = liste_capteurs_cpu | sort(attribute='state', reverse=True) | first %}
           {% if gros_consommateur %}
             {% set enquete.resultat = {
                'nom': state_attr(gros_consommateur.entity_id, 'friendly_name') | default(gros_consommateur.entity_id),
                'identifiant_icone': gros_consommateur.entity_id.replace('sensor.', '').replace('_cpu_percent', '').replace('_pourcentage_du_processeur', ''),
                'cpu': gros_consommateur.state,
                'ram': states(gros_consommateur.entity_id.replace('cpu', 'memory').replace('processeur', 'memoire')),
                'etat': 'SURCHARGE'
             } %}

           {% endif %}

        {% elif trigger.id == 'host_disk' %}
           {# CAS DISQUE #}
           {% set enquete.resultat = {
              'nom': 'Stockage Système',
              'identifiant_icone': 'homeassistant',
              'cpu': states('sensor.system_monitor_utilisation_du_processeur'),
              'ram': states('sensor.glances_ha_utilisation_de_la_memoire'),
              'disk': states('sensor.glances_ha_utilisation_disque_data'),
              'etat': 'DISQUE PLEIN'
           } %}

        {% elif trigger.id == 'host_gpu' %}
           {# CAS GPU #}
           {% set enquete.resultat = {
              'nom': 'Puce Graphique (Intel)',
              'identifiant_icone': 'frigate',
              'cpu': states('sensor.frigate_intel_vaapi_gpu_load'),
              'ram': states('sensor.glances_ha_utilisation_de_la_memoire'),
              'disk': states('sensor.glances_ha_utilisation_disque_data'),
              'etat': 'SURCHARGE GPU'
           } %}
        
        {% else %}
           {# CAS CASSE GÉNÉRALE (Hog/Heat/Ram) #}
           {% set enquete.resultat = {
              'nom': 'Serveur Hôte (N100)',
              'identifiant_icone': 'homeassistant',
              'cpu': states('sensor.system_monitor_utilisation_du_processeur'),
              'ram': states('sensor.glances_ha_utilisation_de_la_memoire'),
              'disk': states('sensor.glances_ha_utilisation_disque_data'),
              'etat': 'CRITIQUE'
           } %}
        {% endif %}
        
        {# On renvoie les conclusions #}
        {{ enquete.resultat }}

  # --------------------------------------------------------------------------
  # B. BRAIN : K-2SO GÉNÈRE LE MESSAGE 🧠
  # --------------------------------------------------------------------------
  - action: script.k_2so_generateur_de_message
    data:
      mission: >
        {% set info = enquete.resultat %}
        {% if info.etat == 'OFF' %}
          Panne Critique : {{ info.nom }} ne répond plus.
        {% elif 'SURCHARGE' in info.etat %}
          Surcharge Système : {{ info.nom }} souffre.
        {% elif 'DISQUE' in info.etat %}
          Espace Disque Critique : {{ info.nom }} est saturé.
        {% else %}
          Alerte Ressources : {{ info.nom }} est en zone rouge.
        {% endif %}
      
      details: >
        - CPU : {{ enquete.resultat.cpu }}%
        - RAM : {{ enquete.resultat.ram }}%
        - Disque : {{ enquete.resultat.disk }}%
        - État : {{ enquete.resultat.etat }}
      
      consigne: "Sois technique, sarcastique et bref."
    response_variable: generated_message

  # --------------------------------------------------------------------------
  # C. NOTIFICATION DISCORD (Style "Visuel" avec Icône dynamique) 🚨
  # --------------------------------------------------------------------------
  - action: script.notification_discord
    data:
      # Titre Visuel
      nom: >
        {% if enquete.resultat.etat == 'OFF' %}
          🚨 CRASH : {{ enquete.resultat.nom }}
        {% else %}
          ⚠️ {{ enquete.resultat.etat }}
        {% endif %}
      
      # Message K-2SO
      description: "{{ generated_message.data }}"
      
      # Icône Dynamique (Offielle Home Assistant Brands)
      image_url: "https://brands.home-assistant.io/{{ enquete.resultat.identifiant_icone }}/icon.png"


